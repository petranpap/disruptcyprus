    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Apply the saved/system theme before first paint to avoid a light flash in dark mode.
      ;(function () {
        try {
          // ?theme=dark|light overrides for QA and screenshots.
          var forced = new URLSearchParams(location.search).get('theme')
          var saved = forced === 'dark' || forced === 'light' ? forced : localStorage.getItem('dc.theme')
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          var locale = localStorage.getItem('dc.locale')
          if (locale === 'en' || locale === 'el') document.documentElement.lang = locale
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>

    <a
      href="#main"
      class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-[100] focus:rounded-control focus:bg-surface-container-lowest focus:px-4 focus:py-2"
      >Skip to content</a
    >
