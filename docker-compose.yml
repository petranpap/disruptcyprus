# Local development stack. Works with podman-compose (rootless) and Docker Compose on Linux.
#
# Networking: every service uses host networking and binds to 127.0.0.1 only.
# Reason: rootless podman's bridge networking (pasta) fails on this machine
# ("Failed to remount /: Permission denied"). Host networking needs no helper.
# Ports: nginx 8080, php-fpm 9000, mariadb 3307 (3306 is taken by a host MySQL),
# mailpit SMTP 1025 / UI 8025, Vite dev server 5173.
#
# Versions mirror production (Ubuntu 24.04): PHP 8.4, MariaDB 10.11, Node 20, no Redis
# (cache, queue and sessions use the database).
#
# Docker users: remove the `userns_mode` lines (podman-only).
name: disrupt

x-podman:
  in_pod: false

x-php: &php
  build:
    context: ./docker/php
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: localhost/disrupt-php:dev
  network_mode: host
  userns_mode: keep-id
  volumes:
    - ./backend:/var/www/html:z
  depends_on:
    - mariadb

services:
  app:
    <<: *php
    command: php-fpm

  queue:
    <<: *php
    command: php artisan queue:work --tries=3 --backoff=10 --sleep=1
    restart: unless-stopped

  scheduler:
    <<: *php
    command: php artisan schedule:work
    restart: unless-stopped

  nginx:
    image: docker.io/library/nginx:1.29-alpine
    network_mode: host
    volumes:
      - ./backend:/var/www/html:ro,z
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro,z
    depends_on:
      - app

  mariadb:
    image: docker.io/library/mariadb:10.11
    network_mode: host
    environment:
      MARIADB_DATABASE: disrupt
      MARIADB_USER: disrupt
      MARIADB_PASSWORD: secret
      MARIADB_ROOT_PASSWORD: root
    command: >-
      --port=3307 --bind-address=127.0.0.1
      --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro,z

  mailpit:
    image: docker.io/axllent/mailpit:latest
    network_mode: host
    command: --smtp 127.0.0.1:1025 --listen 127.0.0.1:8025

  # React PWA dev server (Vite). Same Node major as the production server.
  node:
    image: docker.io/library/node:20-alpine
    network_mode: host
    userns_mode: keep-id
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    environment:
      HOME: /tmp
      npm_config_cache: /tmp/.npm
    volumes:
      - ./web:/app:z
      # The token generator also writes the Blade site's tokens.css + fonts.
      - ./backend/public/site:/backend/public/site:z
    command: sh -c "test -d node_modules || npm ci; npm run dev"

volumes:
  mariadb-data:
