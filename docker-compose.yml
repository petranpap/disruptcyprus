# Local development stack. Works with podman-compose (rootless) and Docker Compose on Linux.
#
# Networking: every service uses host networking and binds to 127.0.0.1 only.
# Reason: rootless podman's bridge networking (pasta) fails on this machine
# ("Failed to remount /: Permission denied"). Host networking needs no helper.
# Ports: nginx 8080, php-fpm 9000, mysql 3307 (3306 is taken by a host MySQL),
# redis 6379, mailpit SMTP 1025 / UI 8025.
#
# Docker users: remove the `userns_mode` lines (podman-only).
name: disrupt

x-podman:
  in_pod: false

x-php: &php
  build:
    context: ./docker/php
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: localhost/disrupt-php:dev
  network_mode: host
  userns_mode: keep-id
  volumes:
    - ./backend:/var/www/html:z
  depends_on:
    - mysql
    - redis

services:
  app:
    <<: *php
    command: php-fpm

  queue:
    <<: *php
    command: php artisan queue:work --tries=3 --backoff=10 --sleep=1
    restart: unless-stopped

  scheduler:
    <<: *php
    command: php artisan schedule:work
    restart: unless-stopped

  nginx:
    image: docker.io/library/nginx:1.29-alpine
    network_mode: host
    volumes:
      - ./backend:/var/www/html:ro,z
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro,z
    depends_on:
      - app

  mysql:
    image: docker.io/library/mysql:8.4
    network_mode: host
    environment:
      MYSQL_DATABASE: disrupt
      MYSQL_USER: disrupt
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    command: >-
      --port=3307 --bind-address=127.0.0.1 --mysqlx=OFF
      --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro,z

  redis:
    image: docker.io/library/redis:7-alpine
    network_mode: host
    command: redis-server --bind 127.0.0.1 --port 6379
    volumes:
      - redis-data:/data

  mailpit:
    image: docker.io/axllent/mailpit:latest
    network_mode: host
    command: --smtp 127.0.0.1:1025 --listen 127.0.0.1:8025

volumes:
  mysql-data:
  redis-data:
