name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (PHP 8.4, MariaDB 10.11)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      mariadb:
        # Same major as production; tests rely on its FULLTEXT and JSON behaviour.
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: disrupt_testing
          MARIADB_USER: disrupt
          MARIADB_PASSWORD: secret
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: disrupt
      DB_PASSWORD: secret
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # Only what the production server has (no redis, no bcmath).
          extensions: pdo_mysql, mysqli, intl, gd, exif, zip, pcntl, mbstring, fileinfo
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('backend/composer.lock') }}

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (Larastan level 6)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Tests (Pest)
        run: php artisan test --compact

      - name: Known vulnerabilities in dependencies
        run: composer audit --no-dev

  web:
    name: Web (Node 20)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Formatting
        run: npx prettier --check .

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build (tokens + typecheck + Vite)
        run: npm run build

      - name: Generated files are committed
        # `npm run tokens` regenerates src/styles/theme.css and the public site's tokens/fonts/icons.
        working-directory: .
        run: git diff --exit-code -- web/src/styles/theme.css backend/public/site

      - name: Known vulnerabilities in dependencies
        run: npm audit --omit=dev --audit-level=high
